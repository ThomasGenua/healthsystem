<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#2b3240;--text:#d7dde6;--dim:#8b95a5;--acc:#4ea1ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149;font-size:15px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{display:flex;align-items:baseline;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:17px;letter-spacing:.04em}
header .sub{color:var(--dim);font-size:12px}
nav{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{background:none;border:none;color:var(--dim);padding:10px 12px;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
nav button.on{color:var(--text);border-bottom-color:var(--acc)}
main{padding:16px 20px;max-width:1200px}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 16px;min-width:130px}
.card .n{font-size:22px}
.card .l{color:var(--dim);font-size:12px}
table{border-collapse:collapse;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:normal;font-size:12px}
tr:last-child td{border-bottom:none}
tr.row{cursor:pointer}
tr.row:hover td{background:#1b2230}
.tag{padding:1px 7px;border-radius:9px;font-size:12px}
.tag.ok{background:#12321c;color:var(--ok)}.tag.warn{background:#332a12;color:var(--warn)}.tag.bad{background:#3a1518;color:var(--bad)}.tag.dim{background:#232a36;color:var(--dim)}
pre{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-word}
select,input,textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;color:var(--text);padding:6px 9px;font:inherit}
textarea{width:100%;min-height:170px}
button.act{background:#1c2634;border:1px solid var(--line);border-radius:5px;color:var(--text);padding:6px 12px;cursor:pointer;font:inherit}
button.act:hover{border-color:var(--acc)}
button.mini{padding:2px 8px;font-size:12px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.split{grid-template-columns:1fr}}

a{color:var(--acc);text-decoration:none}

.rowlist input,.rowlist select{font-size:12px;padding:4px 7px}
svg .axis{stroke:var(--line)}
svg text{fill:var(--dim);font-size:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 0;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

/* The clinical surface.

   A summary is read as complete — that is its clinical function — so the one
   thing this stylesheet has to do is make a panel that is NOT complete
   impossible to mistake for one that is. An empty panel and an empty panel
   that failed to load look identical unless something here makes them differ,
   and an allergy list that is short because a store threw is the failure the
   whole chart module is built to refuse.

   So incompleteness is carried on the left border and in a line of prose
   inside the panel, not in a subtle tint somebody reads past at 3am. The three
   reasons are visually distinct because they call for different actions:
   failed means go and look elsewhere before you prescribe, truncated means
   there is more below, withheld means the patient asked and break-glass is the
   way through. */
.panel{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:6px;padding:10px 14px;margin-bottom:10px}
.panel.bad{border-left-color:var(--bad)}
.panel.warn{border-left-color:var(--warn)}
.panel.held{border-left-color:var(--acc)}
.panel h3{margin:0 0 6px;font-size:13px;font-weight:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);display:flex;gap:8px;align-items:center}
.panel .why{margin:4px 0 0;font-size:12.5px;padding:6px 9px;border-radius:4px;background:#1b2230}
.panel.bad .why{color:var(--bad)}
.panel.warn .why{color:var(--warn)}
.panel.held .why{color:var(--acc)}
.panel ul{margin:4px 0 0;padding-left:18px}
.panel li{margin:2px 0}
.panel .none{color:var(--dim);font-size:12.5px;margin:2px 0 0}
.banner{border:1px solid var(--line);border-left:3px solid var(--warn);background:#241d0f;border-radius:6px;padding:10px 14px;margin-bottom:14px}
.banner.bad{border-left-color:var(--bad);background:#2a1416}
.banner b{color:var(--warn)}
.banner.bad b{color:var(--bad)}
.banner ul{margin:6px 0 0;padding-left:18px}
.crit{color:var(--bad);font-weight:bold}
.chartgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:900px){.chartgrid{grid-template-columns:1fr}}
</style>

<header><h1><a href="/"><span class="brand-star">✦</span>northstar.</a></h1><span class="sub">CLINICAL WORKSPACE</span><div class="account"><span class="avatar" aria-hidden="true">T</span><span class="account-email" id="account-email">Administrator</span><button class="signout" id="sign-out" type="button">Sign out</button></div></header>
<nav id="nav" aria-label="Workspace"></nav>
<div class="workspace-top" id="workspace-top"><div class="crumb">Workspace / <span id="breadcrumb">Overview</span></div><div class="page-heading"><div><h2 id="page-title">Your workspace, at a glance.</h2><p id="page-description">A clear view of your connections, activity, and next steps.</p></div><span class="live-pill">Local workspace</span></div></div>
<main id="main" tabindex="-1"><p role="status">Checking your session…</p></main>
<footer class="workspace-footer"><span>Northstar · Connected care</span><div><a href="/privacy">Privacy policy</a><a href="/terms">Terms of service</a><a href="/contact">Help & setup ↗</a></div></footer>
<script nonce="{{nonce}}">
const $=(s,el=document)=>el.querySelector(s);
/* Escapes apostrophes as well as the usual four, so a value is safe in a
   single-quoted attribute as much as a double-quoted one.

   That is sufficient because no attribute in this page is JavaScript any more.
   It was not sufficient when they were, and the comment that used to stand
   here said it was: an attribute value is HTML-decoded before any script in it
   is parsed, so `&#39;` reaches the JavaScript parser as the apostrophe it was
   escaped from, and closes the string literal it was meant to stay inside. See
   the handler table below for what replaced them. */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// The key lives in this browser and is attached to every request. Nothing is
// sent anywhere else, and the server never returns a stored key.
// Browser storage keys moved with the rename, so each read falls back to the
// pre-rename key and writes the value forward. Renaming them outright would
// not fail — it would silently log every clinician out, drop the stored API
// key, and lose the chart they had open, on the first load after an upgrade.
const store=(s,k)=>{
  const cur=s.getItem("northstar."+k);
  if(cur!==null)return cur;
  const old=s.getItem("portage."+k);
  if(old!==null){try{s.setItem("northstar."+k,old);s.removeItem("portage."+k);}catch{}}
  return old;
};
const KEY="northstar.apikey";
const apiKey=()=>store(localStorage,"apikey")||"";
const j=async(url,opts={})=>{
  // `allow403` is for the caller that renders a 403 itself. A 403 is two
  // different sentences — "this key lacks the scope" and "a patient
  // directive withholds this record" — and the chart tab has to read the
  // body to say the second one and offer break-glass for the right chart.
  // Every other caller keeps the thrown scope error.
  const {allow403,...rest}=opts;
  const key=adminSession?"":apiKey();
  const headers={...(rest.headers||{}),...(adminSession?{"x-csrf-token":adminSession.csrf}:{}),...(key?{authorization:"Bearer "+key}:{})};
  const r=await fetch(url,{...rest,headers});
  const b=await r.text();let d;try{d=JSON.parse(b)}catch{d=b}
  if(r.status===401||(r.status===403&&!allow403))throw new Error(r.status===401?"Your session has expired. Sign in again to continue.":"Your access does not allow this action");
  if(!r.ok&&!(d&&typeof d==="object"))throw new Error(r.status+" "+b);
  return{status:r.status,data:d};
};
const tag=(t,cls)=>`<span class="tag ${cls}">${esc(t)}</span>`;
const stTag=s=>tag(s,{processed:"ok",delivered:"ok",filtered:"dim",queued:"warn",retrying:"warn",inflight:"warn",error:"bad",dead:"bad",discarded:"dim",active:"ok"}[s]||"dim");
let adminSession=null,workspaceReady=false;
const TABS=["API keys","Dashboard","Chart","Worklist","Clinic board","Arrangements","Break-glass","Privacy","History","Audit","Channels","Designer","Mappings","Messages","Deliveries","FHIR","Subscriptions","Terminology","Conformance"];
let tab="Dashboard",timer=null;

const GROUPS=[['Overview',['Dashboard','History']],['Care',['Chart','Worklist','Clinic board','Arrangements']],['Integrations',['Channels','Designer','Mappings','Messages','Deliveries','FHIR','Subscriptions']],['Governance',['Break-glass','Privacy','Audit','Terminology','Conformance']],['Settings',['API keys']]];
function nav(){
  $('#nav').innerHTML=GROUPS.map(([name,tabs])=>`<details class="${tabs.includes(tab)?'on':''}"><summary>${name}</summary><div class="submenu">${tabs.map(t=>`<button class="${t===tab?'on':''}" ${t===tab?'aria-current="page"':''} data-act="go" data-tab="${esc(t)}">${t==='Dashboard'?'Dashboard':esc(t)}</button>`).join('')}</div></details>`).join('');
  $('#breadcrumb').textContent=GROUPS.find(g=>g[1].includes(tab))?.[0]||'Overview';
  $('#page-title').textContent=tab==='Dashboard'?'Your workspace, at a glance.':tab;
  $('#page-description').textContent=tab==='Dashboard'?'A clear view of your connections, activity, and next steps.':'Manage '+tab.toLowerCase()+' in your connected care workspace.';
}
document.addEventListener('toggle',e=>{if(e.target.matches('#nav>details')&&e.target.open)document.querySelectorAll('#nav>details').forEach(d=>{if(d!==e.target)d.open=false})},true);
document.addEventListener('click',e=>{if(!e.target.closest('#nav'))document.querySelectorAll('#nav>details').forEach(d=>d.open=false)});

window.go=t=>{if(!workspaceReady)return;if(!TABS.includes(t))return;tab=t;if(timer){clearInterval(timer);timer=null}nav();render()};

/* Every handler is bound here rather than written into the markup.

   `onclick="openChart('${esc(id)}')"` is two languages in one attribute, and
   escaping is only ever right for one of them. The browser HTML-decodes an
   attribute value before parsing the script inside it, so an escaped
   apostrophe is an apostrophe again by the time it reaches the string literal
   it was supposed to stay inside — and a patient identifier is whatever PID-3
   of an unauthenticated MLLP feed said it was. That was an injection into the
   session of whoever holds an admin key, which is every key this console has.
   `test/ui-xss.test.ts` drives a real browser and watched it fire.

   A data attribute has no second language. It is read back through `.dataset`
   as a string and never parsed, so escaping it as an attribute value is the
   whole of what is needed. It is also what allows the Content-Security-Policy
   this page is served with to omit 'unsafe-inline': with no script in the
   markup, there is nothing for an injected value to be parsed as. */
const call=(table,name,el)=>{if(name!==undefined&&Object.hasOwn(table,name))table[name](el,el.dataset)};

const CLICK={
  go:(el,d)=>go(d.tab),
  render:()=>render(),
  loadChart:()=>loadChart(),
  findPatient:()=>findPatient(),
  loadWorklist:()=>loadWorklist(),
  openPrivacyReview:()=>openPrivacyReview(),
  openChart:(el,d)=>openChart(d.id),
  // Opens a chart and switches to it: what the worklist and the privacy
  // queues link for, and what the trailing `go('Chart')` used to do.
  chart:(el,d)=>{openChart(d.id);go("Chart")},
  declareGlass:(el,d)=>declareGlass(d.id),
  ack:(el,d)=>ack(d.id),
  told:(el,d)=>told(d.id),
  reviewed:(el,d)=>reviewed(d.id),
  chanDetail:(el,d)=>chanDetail(d.id),
  // The button sits inside a row that opens the channel. `closest` finds the
  // button first, so the row does not also fire — which is what the
  // `event.stopPropagation()` in front of this used to be for.
  verifyChain:(el,d)=>verifyChain(d.id,el),
  msgDetail:(el,d)=>msgDetail(d.id),
  delivery:(el,d)=>act(d.id,d.op),
  readRes:(el,d)=>readRes(d.type,d.id),
  delSub:(el,d)=>delSub(d.id),
  dstepAdd:()=>dstepAdd(),
  dstepDel:(el,d)=>dstepDel(Number(d.i)),
  ddestAdd:()=>ddestAdd(),
  ddestDel:(el,d)=>ddestDel(Number(d.i)),
  dsave:()=>dsave(),
  dload:()=>dload(),
  dloadPick:()=>dloadPick(),
  mpRun:()=>mpRun(),
  mkSub:()=>mkSub(),
  doLookup:()=>doLookup(),
  doExpand:()=>doExpand(),
  doTranslate:()=>doTranslate(),
  doCap:()=>doCap(),
  doValidate:()=>doValidate(),
};
const CHANGED={
  dsource:el=>dsource(el.value),
  ddestOrdered:(el,d)=>ddestOrdered(Number(d.i),el.checked),
  mpLoad:()=>mpLoad(),
  mpFixture:()=>mpFixture(),
};
const TYPED={
  dset:(el,d)=>dset(d.k,el.value),
  dsrc:(el,d)=>dsrc(d.k,el.value),
  dstep:(el,d)=>dstep(Number(d.i),d.k,el.value),
  ddest:(el,d)=>ddest(Number(d.i),d.k,el.value),
};

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el)return;
  // These sit on <a href="#"> and on table rows, where the handler is the
  // whole of what the click is for. This is the `return false` that used to
  // end each one.
  e.preventDefault();
  call(CLICK,el.dataset.act,el);
});
document.addEventListener("input",e=>{call(TYPED,e.target.dataset.fn,e.target)});
document.addEventListener("submit",e=>{if(e.target.matches('form[data-arrangement]')){e.preventDefault();saveArrangement(e.target)}});
document.addEventListener("change",e=>{
  const el=e.target;
  const key=el.dataset.set;
  if(key!==undefined){
    // A checkbox reports a flag; everything else reports its text.
    $("#main").dataset[key]=el.dataset.bool!==undefined?(el.checked?"1":""):el.value;
    render();
    return;
  }
  call(CHANGED,el.dataset.change,el);
});

  const m=$("#main");

  try{
    if(tab==="API keys")await keysTab(m);

    else if(tab==="Chart")await chartTab(m);
    else if(tab==="Worklist")await worklistTab(m);
    else if(tab==="Arrangements")await arrangementsTab(m);
    else if(tab==="Clinic board")await clinicBoardTab(m);
    else if(tab==="Break-glass")await glassTab(m);
    else if(tab==="Privacy")await privacyTab(m);
    else if(tab==="History")await history(m);
    else if(tab==="Audit")await auditTab(m);
    else if(tab==="Designer")await designer(m);
    else if(tab==="Mappings")await mapEditor(m);
    else if(tab==="Channels")await channels(m);

  }catch(e){if(tab===renderingTab)m.innerHTML=`<p class="err" role="alert">${esc(e.message||e)}</p><button class="act" data-act="render">Try again</button>`}
}

async function saveArrangement(form){
  const card=form.closest('article'), feedback=form.querySelector('[data-feedback]');
  if(card.dataset.saving)return;
  const value=form.elements.value.value.trim();
  if(!value){feedback.textContent='Enter the required details before saving.';return}
  card.dataset.saving='yes';card.querySelectorAll('button').forEach(b=>b.disabled=true);
  feedback.className='';feedback.textContent='Saving…';
  try{
    const r=await j('/api/clinical/arrangement-'+form.dataset.operation,{allow403:true,method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:form.dataset.arrangement,[form.dataset.field]:value})});
    if(r.status!==200)throw new Error(r.data.error||'Could not save this change.');
    card.querySelector('[data-owner]').textContent=r.data.owner_id||'Unassigned — ownership needed';
    card.querySelector('[data-updated]').textContent=r.data.updated_at;
    if(form.dataset.operation==='assign'){feedback.textContent='Responsibility assigned.'}
    else{
      card.querySelector('.tag').textContent=r.data.status;
      card.querySelector('[data-outcome]').textContent=r.data.status==='confirmed'?'Confirmation saved. This item is no longer outstanding.':'Cancellation saved. This item is no longer outstanding.';
      card.querySelector('details').remove();
      const count=card.closest('main')?.querySelector('[data-arrangement-count]');
      if(count){const n=Math.max(0,Number(count.dataset.arrangementCount)-1);count.dataset.arrangementCount=String(n);count.textContent=n+' visible outstanding arrangement'+(n===1?'':'s')}
    }
  }catch(error){feedback.textContent=error.message||'Could not save. Your details are still here.';feedback.className='err'}
  finally{delete card.dataset.saving;card.querySelectorAll('button').forEach(b=>b.disabled=false)}
}

/* ---------------------------------------------------------------- clinical

   Three tabs, and one idea running through all of them: the honesty the
   stores go to such lengths to produce is worth nothing until it reaches
   somebody's eyes. `complete` and `omissions` have existed on every section
   since the chart was written, and until now nothing rendered them.

   Everything here goes through the same clinical API as any other caller.
   There is no privileged path, which means every read below leaves an audit
   row and passes the directive check — a console that could see more than the
   API allows would make the audit trail a description of something other than
   what happened. */

/* How a section says it is not the whole truth.

   Distinguishing the reasons is the point. `unavailable` is a fault, and the
   panel must not be read as "none". `withheld` is the patient's instruction,
   which is not a fault at all and must not be rendered as one — a clinician
   who reads a lockbox as an outage goes looking for a bug instead of having a
   conversation. `truncated` just means there is more. `stale` means true as
   of the cache's fill time — so the age goes on the panel itself, not only
   the banner above it, and an empty stale panel must never read as a current
   "none": a cached "no known drug allergies" from before this morning's
   reaction read as current is the exact failure the reason exists to refuse. */
function panel(title,sec,render,extra){
  const inc=sec&&sec.incomplete;
  const cls=!inc?"":inc.reason==="unavailable"?"bad":inc.reason==="withheld"?"held":"warn";
  const items=(sec&&sec.items)||[];
  let why="";
  if(inc&&inc.reason==="unavailable")why=`this panel is empty because it failed to load, not because there is nothing — ${esc(inc.detail)}`;
  else if(inc&&inc.reason==="withheld")why=esc(inc.detail);
  else if(inc&&inc.reason==="truncated")why=`showing ${inc.shown} of ${inc.total}`;
  else if(inc&&inc.reason==="stale")why=`as of ${esc(String(inc.ageHours))} hours ago — anything recorded since the cache was filled is not here`;
  const body=inc&&inc.reason==="withheld"?""
    :items.length?`<ul>${items.map(render).join("")}</ul>`
    :`<p class="none">${inc&&inc.reason==="stale"?"none recorded as of the cache — ask; something may have happened since":"none recorded"}</p>`;
  return `<div class="panel ${cls}"><h3>${esc(title)}${extra?" "+extra:""}${inc?tag(inc.reason,cls):""}</h3>
    ${why?`<p class="why">${why}</p>`:""}${body}</div>`;
}

const when=v=>esc(String(v??"").replace("T"," ").slice(0,16));
/* Chart entries carry their FHIR resource as a JSON string, so a renderer that
   reaches straight for `.code.text` gets undefined and falls back to printing
   the entry type — a problem list reading "Condition, Condition", which is
   both useless and looks like data rather than a bug. */
const body=e=>{try{return JSON.parse(e.content)}catch{return{}}};
/* A date qualifier that disappears when there is no date, rather than leaving
   a bare "due" on the row. An empty deadline is not the same as a deadline, and
   a label with nothing after it reads as a rendering fault. */
const due=(label,v)=>v?`<span class="none">${esc(label)} ${when(v)}</span>`:"";

window.findPatient=async()=>{
  const family=$("#ptname").value.trim();
  const out=$("#chart");
  if(!family)return;
  try{
    const {data}=await j("/api/clinical/patients?family="+encodeURIComponent(family));
    const rows=(data.rows||[]);
    out.innerHTML=`${data.withheldCount?`<div class="banner"><b>${data.withheldCount} match(es) withheld</b> by a patient directive. A short list that looks complete is the thing this system refuses, so it says so rather than quietly returning fewer.</div>`:""}
      <table><tr><th>identifier</th><th>name</th><th>born</th></tr>
      ${rows.map(r=>`<tr class="row" data-act="openChart" data-id="${esc(r.patient_id)}"><td>${esc(r.patient_id)}</td>
        <td>${esc(r.family||"")}, ${esc(r.given||"")}</td><td>${esc(r.birthDate||r.birth_date||"")}</td></tr>`).join("")
      ||`<tr><td colspan="3" class="none">no match</td></tr>`}</table>`;
  }catch(e){out.innerHTML=`<p class="err">${esc(e.message||e)}</p>`}
};

window.openChart=id=>{sessionStorage.setItem("northstar.patient",id);$("#pt").value=id;loadChart()};

window.loadChart=async()=>{
  const id=$("#pt").value.trim();
  const out=$("#chart");
  if(!id){out.innerHTML="";return}
  sessionStorage.setItem("northstar.patient",id);
  out.innerHTML=`<p class="none">loading…</p>`;
  let c;
  try{
    const r=await j("/api/clinical/chart?patient="+encodeURIComponent(id),{allow403:true});
    if(r.status===403){
      // A 403 with no break-glass pointer is the gate, not a directive.
      if(!(r.data&&r.data.breakGlass)){out.innerHTML=`<p class="err">this key lacks the scope for that</p>`;return}
      // The refusal names the way through, and so does this. A clinician who
      // needs the record in an emergency should not have to know the API.
      // Break-glass is declared per chart, so the form targets the chart the
      // directive is actually on — for a linked chart that is the withheld
      // member, and overriding the queried id would lift nothing.
      const target=r.data.withheldMember||id;
      const linkedNote=target!==id?`<p>The directive is on <b>${esc(target)}</b>, a chart linked to this one — the override is declared for that chart, and lifts only it.</p>`:"";
      out.innerHTML=`<div class="banner bad"><b>This record is withheld by a patient directive.</b>
        <p>The patient has asked that this record not be shown. If the clinical situation warrants overriding that, declare it — the declaration is recorded, the patient is told, and somebody reviews it.</p>${linkedNote}
        <div class="bar"><input id="bg-reason" placeholder="why you need it, and why now" style="width:420px">
        <button class="act" data-act="declareGlass" data-id="${esc(target)}">break glass</button></div>
        <p class="none">A one-word reason is refused. This row is what a privacy office reads when the patient asks who opened their record.</p>
        <div id="bg-out"></div></div>`;
      return;
    }
    c=r.data;
  }catch(e){out.innerHTML=`<p class="err">${esc(e.message||e)}</p>`;return}

  const p=c.patient||{};
  const status=c.allergyStatus;
  const statusTag=status==="never-asked"?tag("never asked","bad")
    :status==="unavailable"?tag("unknown","bad")
    :status==="clear"?tag("no known allergies","ok"):tag(esc(String(status)),"warn");

  out.innerHTML=`
    <div class="cards"><div class="card"><div class="n">${esc(p.family||"—")}, ${esc(p.given||"")}</div><div class="l">${esc(c.patientId)}${p.birthDate?" · born "+esc(p.birthDate):""}${p.preferredLanguage?" · "+esc(p.preferredLanguage):""}${p.phone?" · "+esc(p.phone):""}</div></div>
      <div class="card"><div class="n">${statusTag}</div><div class="l">allergy status</div></div>
      <div class="card"><div class="n">${c.immunizationStatus==="never-asked"?tag("never asked","bad"):tag(esc(String(c.immunizationStatus||"")),"ok")}</div><div class="l">immunization history</div></div>
      <div class="card"><div class="n">${c.vitalStatus==="never-measured"?tag("never measured","bad"):tag(esc(String(c.vitalStatus||"")),"ok")}</div><div class="l">vital signs</div></div>
      <div class="card"><div class="n">${c.procedureStatus==="never-recorded"?tag("never recorded","bad"):tag(esc(String(c.procedureStatus||"")),"ok")}</div><div class="l">procedures</div></div>
      <div class="card"><div class="n">${c.carePlanStatus==="never-planned"?tag("never planned","bad"):tag(esc(String(c.carePlanStatus||"")),"ok")}</div><div class="l">care plans</div></div>
      <div class="card"><div class="n">${c.documentStatus==="never-received"?tag("never received","bad"):tag(esc(String(c.documentStatus||"")),"ok")}</div><div class="l">patient documents</div></div></div>
    ${c.stale?`<div class="banner bad"><b>This chart is a cache, as of ${esc(String(c.stale.ageHours))} hours ago.</b>
      <p>${esc(c.stale.note)} Ask the patient again before acting on an empty panel — especially the allergy list.</p></div>`:""}
    ${c.linked?`<div class="banner"><b>Assembled across linked charts: ${c.linked.members.map(m=>esc(m)).join(", ")}.</b>
      <p>${esc(c.linked.note)}</p></div>`:""}
    ${c.complete?"":`<div class="banner"><b>This is not the whole chart.</b>
      <p>Do not read a panel below as "none" without checking why it is short.</p>
      <ul>${(c.omissions||[]).map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div>`}
    <div class="chartgrid">
      <div>
        ${panel("Allergies",c.allergies,a=>`<li>${esc(a.display)} ${a.criticality?tag(a.criticality,a.criticality==="high"?"bad":"warn"):""} <span class="none">${esc(a.reaction||"")}</span></li>`)}
        ${panel("Medications",c.medications,x=>`<li>${esc(x.display)} <span class="none">${esc(x.adherence||"")}</span></li>`)}
        ${panel("Problems",c.problems,x=>{const b=body(x);return `<li>${esc((b.code&&(b.code.text||(b.code.coding&&b.code.coding[0]&&b.code.coding[0].display)))||b.resourceType||x.entry_type)}${b.clinicalStatus?" "+tag(esc(String(b.clinicalStatus.text||b.clinicalStatus)),"dim"):""}</li>`})}
        ${panel("Immunizations",c.immunizations,x=>`<li>${esc(x.vaccine)} ${stTag(x.status)} <span class="none">${esc(x.occurrenceAt||"")}</span></li>`)}
        ${panel("Vitals",c.vitals,x=>`<li>${esc(x.kind)} ${x.kind==="blood-pressure"?`<b>${esc(String(x.systolic))}/${esc(String(x.diastolic))}</b>`:`<b>${esc(String(x.value))}</b>`} <span class="none">${esc(x.unit||"")} ${when(x.takenAt)}</span></li>`)}
        ${panel("Procedures",c.procedures,x=>`<li>${esc(x.display)} ${stTag(x.status)} <span class="none">${esc(x.performedAt||"")} ${esc(x.reason||"")}</span></li>`)}
        ${panel("Care plans",c.carePlans,x=>`<li>${esc(x.title)} ${stTag(x.status)} <span class="none">review ${esc(x.reviewBy||"")} ${esc((x.goals&&x.goals[0])||"")}</span></li>`)}
        ${panel("Patient-supplied documents",c.documents,x=>`<li>${esc(x.title)} ${stTag(x.source)} <span class="none">${esc(x.contentType||"")} ${esc(x.receivedAt||"")}${x.hasContent?" · on file":" · recorded, not scanned"}</span></li>`)}
        ${panel("Care team",c.careTeam,x=>`<li>${esc(x.role)} — ${esc(x.practitioner_id)}${x.active_to?" "+tag("ended","dim"):""}</li>`)}
        ${panel("Coverage",c.coverage,x=>`<li>${esc(x.plan)} ${stTag(x.eligibility)} <span class="none">${esc(x.identifier_value||"")}</span></li>`)}
        ${panel("Open messages",c.openThreads,x=>`<li>${esc(x.subject)} ${stTag(x.status)} <span class="none">${esc(x.owner_id||"unowned")}</span></li>`)}
        ${panel("Recent notes",c.recentNotes,n=>`<li>${when(n.entry&&n.entry.recorded_at)} — ${esc((n.note&&(n.note.title||n.note.description))||"note")}</li>`)}
      </div>
      <div>
        ${panel("Unacknowledged results",c.unacknowledgedResults,r=>`<li>${esc(r.display)}: <b class="${r.abnormal_flag&&r.abnormal_flag.includes("critical")?"crit":""}">${esc(r.value)}</b>
          ${r.abnormal_flag?tag(r.abnormal_flag,r.abnormal_flag.includes("critical")?"bad":"warn"):""} <span class="none">${when(r.reported_at)}</span></li>`)}
        ${panel("Open orders",c.openOrders,o=>`<li>${esc(o.display)} ${stTag(o.status)} ${due("expected",o.expected_by)}</li>`)}
        ${panel("Open referrals",c.openReferrals,r=>`<li>${esc(r.to_service)} ${stTag(r.status)} ${due("due",r.expected_by)}</li>`)}
        ${panel("Open tasks",c.openTasks,t=>`<li>${esc(t.title)} ${stTag(t.status)}</li>`)}
      </div>
    </div>`;
};

window.declareGlass=async(patient)=>{
  const reason=$("#bg-reason").value.trim();
  const out=$("#bg-out");
  try{
    const {status,data}=await j("/api/clinical/break-glass",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({patient,reason})});
    if(status!==201){out.innerHTML=`<p class="err">${esc(data.error||"refused")}</p>`;return}
    out.innerHTML=`<p class="none">declared — the patient will be told and this will be reviewed</p>`;
    loadChart();
  }catch(e){out.innerHTML=`<p class="err">${esc(e.message||e)}</p>`}
};

  localStorage.setItem("northstar.clinician",who);
  try{
    const {data:w}=await j("/api/clinical/worklist?clinician="+encodeURIComponent(who));
    const {data:res}=await j("/api/clinical/results");
    out.innerHTML=`

async function glassTab(m){
  m.innerHTML=`<p class="none">loading…</p>`;
  try{
    const {data}=await j("/api/clinical/break-glass");
    // The action cell is filled in afterwards rather than by this template,
    // because the two queues need different controls and threading that
    // through here would mean building HTML for a button out of a string in
    // two places. The row itself is identical in both.
    const rows=(list,empty)=>list.length?`<table><tr><th>patient</th><th>who</th><th>declared</th><th>reason</th><th></th></tr>
      ${list.map(o=>`<tr><td><a href="#" data-act="chart" data-id="${esc(o.patient_id)}">${esc(o.patient_id)}</a></td>
        <td>${esc(o.subject_id)}</td><td>${when(o.declared_at)}</td><td>${esc(o.reason)}</td>
        <td></td></tr>`).join("")}</table>`:`<p class="none">${esc(empty)}</p>`;
    m.innerHTML=`
      <div class="panel ${data.awaitingNotification.length?"warn":""}"><h3>Patients not yet told their record was opened ${tag(String(data.awaitingNotification.length),data.awaitingNotification.length?"warn":"ok")}</h3>
        <p class="why">A lockbox nobody can find out was opened is a lockbox with no lock. Telling them happens on a channel this system does not own — a letter, a call — so record it here once it has happened.</p>
        ${rows(data.awaitingNotification,"nobody is owed a notification")}</div>
      <div class="panel ${data.awaitingReview.length?"warn":""}"><h3>Overrides nobody has reviewed ${tag(String(data.awaitingReview.length),data.awaitingReview.length?"warn":"ok")}</h3>
        <p class="why">An override nobody looks at teaches a ward that breaking glass costs nothing, and a directive that costs nothing to break slows down only the people who would have asked.</p>
        ${rows(data.awaitingReview,"nothing is waiting for review")}</div>`;
    // Rendered after the tables so the action cells can carry their own inputs
    // without the row template needing to know which queue it is in.
    m.querySelectorAll("table").forEach((t,i)=>{
      const queue=i===0?data.awaitingNotification:data.awaitingReview;
      t.querySelectorAll("tr").forEach((tr,r)=>{
        if(r===0)return;
        const o=queue[r-1];if(!o)return;
        const cell=tr.lastElementChild;
        cell.innerHTML=i===0
          ?`<button class="act mini" data-act="told" data-id="${esc(o.id)}">record that they were told</button>`
          :`<input id="rv-${esc(o.id)}" placeholder="what you made of it" style="width:210px"><button class="act mini" data-act="reviewed" data-id="${esc(o.id)}">record</button>`;
      });
    });
  }catch(e){m.innerHTML=`<p class="err">${esc(e.message||e)}</p>`}
}

// Inline SVG rather than a chart library: this file is served whole with no
// build step and no external fetches, and a CDN script would break that.
function barChart(buckets,series,height=150){
  if(!buckets.length)return '<p class="sub" style="color:var(--dim)">no activity in this window</p>';
  // Bar width is capped so a window holding one or two buckets shows readable
  // bars rather than two enormous slabs.
  const pad=26,bw=Math.min(48,Math.max(10,600/buckets.length)),w=Math.max(360,pad*2+bw*buckets.length);
  const totals=buckets.map((_,i)=>series.reduce((a,s)=>a+(s.values[i]||0),0));
  const max=Math.max(1,...totals);
  const y=v=>height-pad-(v/max)*(height-pad*2);
  let bars="";
  buckets.forEach((b,i)=>{
    let base=height-pad;
    series.forEach(s=>{
      const v=s.values[i]||0;if(!v)return;
      const h=(v/max)*(height-pad*2);base-=h;
      bars+=`<rect x="${pad+i*bw+2}" y="${base}" width="${Math.max(1,bw-4)}" height="${h}" fill="${s.color}"><title>${esc(b)} ${esc(s.label)}: ${v}</title></rect>`;
    });
  });
  const every=Math.ceil(buckets.length/8);
  const labels=buckets.map((b,i)=>i%every?"":`<text x="${pad+i*bw+bw/2}" y="${height-8}" text-anchor="middle">${esc(b.slice(-5))}</text>`).join("");
  return `<div style="overflow-x:auto"><svg width="${w}" height="${height}" role="img">
    <line class="axis" x1="${pad}" y1="${height-pad}" x2="${w-pad}" y2="${height-pad}"/>
    <line class="axis" x1="${pad}" y1="${pad}" x2="${pad}" y2="${height-pad}"/>
    <text x="4" y="${y(max)+4}">${max}</text><text x="4" y="${height-pad+4}">0</text>
    ${bars}${labels}</svg></div>`;
}

const legend=series=>`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join("")}</div>`;

async function history(m){
  const hours=m.dataset.hours||"24",bucket=m.dataset.bucket||"hour";
  const {data}=await j(`/api/history?hours=${hours}&bucket=${bucket}`);

  // Pivot the grouped rows into one series per status over a shared axis.
  const keys=[...new Set([...data.messages.map(r=>r.bucket),...data.deliveries.map(r=>r.bucket)])].sort();
  const series=(rows,field,wanted,color)=>({
    label:wanted,color,
    values:keys.map(k=>rows.filter(r=>r.bucket===k&&(field?r[field]===wanted:true)).reduce((a,r)=>a+r.n,0)),
  });
  const msgSeries=[
    series(data.messages,"status","processed","#3fb950"),
    series(data.messages,"status","filtered","#8b95a5"),
    series(data.messages,"status","error","#f85149"),
  ].filter(s=>s.values.some(v=>v>0));
  const delSeries=[series(data.deliveries,null,"delivered","#4ea1ff")].filter(s=>s.values.some(v=>v>0));

  const sum=s=>s.reduce((a,x)=>a+x.values.reduce((b,v)=>b+v,0),0);
  m.innerHTML=`<div class="bar">
      <select data-set="hours">${["6","24","72","168"].map(h=>`<option value="${h}" ${h===hours?"selected":""}>last ${h}h</option>`).join("")}</select>
      <select data-set="bucket">${["hour","day"].map(b=>`<option ${b===bucket?"selected":""}>${b}</option>`).join("")}</select>
      <button class="act mini" data-act="render">refresh</button></div>
    <div class="cards"><div class="card"><div class="n">${sum(msgSeries)}</div><div class="l">messages received</div></div>
      <div class="card"><div class="n">${sum(delSeries)}</div><div class="l">deliveries completed</div></div></div>
    <h2>messages received, by status</h2>${barChart(keys,msgSeries)}${msgSeries.length?legend(msgSeries):""}
    <h2>deliveries completed</h2>${barChart(keys,delSeries)}
    <p class="sub" style="color:var(--dim)">Messages are bucketed by arrival, deliveries by completion. A message
      received during an outage and delivered hours later appears in both, at different times — which is the point.</p>`;
}

  sftp:[["host","text","sftp.example.org"],["port","number","22"],["username","text","northstar"],["password","text",""],["privateKeyPath","text","/etc/northstar/id_ed25519"],["dir","text","/outbound"],["pattern","text","\\\\.hl7$"],["archiveDir","text","optional"],["pollMs","number","5000"],["cron","text","optional"]],
};
const STEPS={
  "filter.hl7Type":[["allow","text","ADT^A01,ADT^A04"]],
  "filter.hl7FieldEquals":[["path","text","PID-8"],["equals","text","F"]],
  "filter.jsonEquals":[["path","text","resourceType"],["equals","text","Patient"]],
  "split.hl7Segment":[["segment","text","OBX"]],
  "split.hl7Group":[["segment","text","OBR"]],
  "transform.mapping":[["mapping","text","adt-patient"]],
  "validate.profile":[["pack","text","ps-ca"],["mode","text","reject | annotate"]],
};
const DESTS={
  fhirstore:[["validatePack","text","optional, e.g. ps-ca"],["validateMode","text","reject | annotate"]],
  http:[["url","text","https://host/fhir/Patient"],["method","text","POST"],["contentType","text","application/fhir+json"],["timeoutMs","number","15000"]],
  mllp:[["host","text","10.0.0.5"],["port","number","6661"],["timeoutMs","number","15000"]],
};
const COMMON_DEST=[["maxAttempts","number","8"],["backoffBaseMs","number","1000"],["backoffCapMs","number","300000"]];

let design={id:"",name:"",sourceType:"mllp",source:{},steps:[],dests:[{type:"fhirstore",fields:{},ordered:true}]};

const fieldRow=(defs,bag,fn)=>defs.map(([k,type,ph])=>
  `<label class="sub" style="color:var(--dim)">${k}</label>
   <input type="${type}" placeholder="${esc(ph)}" value="${esc(bag[k]??"")}" data-fn="${esc(fn)}" data-k="${esc(k)}">`).join("");

function buildConfig(){
  const cfg={id:design.id,name:design.name||design.id,source:{type:design.sourceType}};
  for(const[k,v]of Object.entries(design.source)){
    if(v==="")continue;
    if(k==="resourceTypes")cfg.source[k]=String(v).split(",").map(s=>s.trim()).filter(Boolean);
    else if(k==="port"||k==="pollMs")cfg.source[k]=Number(v);
    else cfg.source[k]=v;
  }
  if(design.steps.length)cfg.pipeline=design.steps.map(s=>{
    const step={type:s.type};
    for(const[k,v]of Object.entries(s.fields)){
      if(v==="")continue;
      step[k]=k==="allow"?String(v).split(",").map(x=>x.trim()).filter(Boolean):v;
    }
    return step;
  });
  cfg.destinations=design.dests.map((d,i)=>{
    const dest={id:d.fields.id||`dest-${i+1}`,type:d.type,ordered:!!d.ordered};
    for(const[k,v]of Object.entries(d.fields)){
      if(v===""||k==="id")continue;
      dest[k]=["maxAttempts","backoffBaseMs","backoffCapMs","timeoutMs","port"].includes(k)?Number(v):v;
    }
    return dest;
  });
  return cfg;
}

  const name=($('#key-name')?.value||'Workspace integration').trim();
  const button=document.querySelector('[data-act="newKey"]');if(button)button.disabled=true;
  try{const r=await j('/api/keys',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,scopes:['read','write'],expiresAt:new Date(Date.now()+90*86400000).toISOString()})});if(r.status!==201)throw Error(r.data.error||'Could not generate a key');
    output.innerHTML=`<div class="notice" style="margin-top:20px"><strong>Your new API key is ready.</strong><p>Copy it now and store it securely. This secret will not be displayed again. It has read/write integration access and expires in 90 days.</p><pre id="generated-secret"></pre><button class="act" id="copy-key" type="button">Copy key</button><span id="copy-result" role="status"></span></div>`;$('#generated-secret').textContent=r.data.key;$('#copy-key').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(r.data.key);$('#copy-result').textContent=' Copied'}catch{$('#copy-result').textContent=' Select and copy the key above.'}});
  }catch(e){output.textContent=e.message;output.className='err'}finally{if(button)button.disabled=false}
}
CLICK.newKey=generateKey;
CLICK.useExisting=async()=>{const key=$('#existing-key').value.trim();const feedback=$('#existing-feedback');try{const r=await fetch('/api/keys',{headers:{authorization:'Bearer '+key}});if(!r.ok)throw Error('This key could not be verified as an admin key.');localStorage.setItem(KEY,key);feedback.textContent='API key verified and saved in this browser.'}catch(e){feedback.textContent=e.message}};
async function showSetup(){
  $('#workspace-top').hidden=true;$('#nav').hidden=true;
  const count=adminSession.activeKeys;
  $('#main').innerHTML=`<section class="key-box"><div class="key-icon" aria-hidden="true">⚿</div><p class="muted" style="text-transform:uppercase;letter-spacing:1.5px;font-size:10px;margin-top:22px">WORKSPACE SETUP · API ACCESS</p><h2>${count?'Your API keys are already set up.':'Let’s set up your first API key.'}</h2><p>${count?`This instance has ${count} active API key${count===1?'':'s'}. Existing keys stay private and cannot be shown again. You can continue with your admin session, or generate a separate key for an integration.`:'Generate an API key before proceeding. Your admin account signs you in; API keys connect your integrations.'}</p><div class="key-state"><span>${count?'✓ API key already generated':'API key generation required'}</span></div><div id="key-output" aria-live="polite"></div><div class="key-actions"><button class="act primary" id="continue-workspace" ${count?'':'disabled'}>Continue to workspace →</button><button class="act" id="setup-generate">Generate a new API key</button></div><p class="muted">You are signed in with your administrator account. Keep generated keys in a secure password manager.</p></section>`;
  $('#continue-workspace').addEventListener('click',()=>{sessionStorage.setItem('northstar.setupConfirmed','yes');openWorkspace()});
  $('#setup-generate').addEventListener('click',async()=>{await generateKey();if($('#generated-secret')){$('#continue-workspace').disabled=false;$('#setup-generate').disabled=true;$('#setup-generate').textContent='New API key generated'}});
}
function openWorkspace(){workspaceReady=true;document.documentElement.dataset.workspaceReady='yes';$('#workspace-top').hidden=false;$('#nav').hidden=false;nav();render()}
$('#sign-out').addEventListener('click',async()=>{if(!adminSession){localStorage.removeItem(KEY);localStorage.removeItem('portage.apikey');location.assign('/login');return}try{const r=await fetch('/auth/admin/logout',{method:'POST',headers:{'x-csrf-token':adminSession.csrf}});if(!r.ok)throw Error('Could not sign out. Refresh and try again.');sessionStorage.removeItem('northstar.setupConfirmed');location.assign('/login')}catch(e){alert(e.message)}});
async function boot(){
  try{const r=await fetch('/auth/admin/session');if(r.ok){const s=await r.json();if(s.enabled===false&&s.apiKeyRequired===false){$('#account-email').textContent='Local workspace';$('#sign-out').hidden=true;openWorkspace();return}if(s.authenticated){adminSession=s;$('#account-email').textContent='Administrator';if(s.activeKeys&&sessionStorage.getItem('northstar.setupConfirmed')==='yes')openWorkspace();else await showSetup();return}}}
  catch{ $('#main').innerHTML='<p class="err" role="alert">Unable to check your session. Refresh to try again.</p>';return }
  if(apiKey()){try{const r=await fetch('/api/keys',{headers:{authorization:'Bearer '+apiKey()}});if(r.ok){$('#account-email').textContent='API key access';openWorkspace();return}}catch{}}
  location.replace('/login'+location.hash);
}
boot();
</script>
