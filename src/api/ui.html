<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portage</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#2b3240;--text:#d7dde6;--dim:#8b95a5;--acc:#4ea1ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149;font-size:15px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{display:flex;align-items:baseline;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:17px;letter-spacing:.04em}
header .sub{color:var(--dim);font-size:12px}
nav{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{background:none;border:none;color:var(--dim);padding:10px 12px;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
nav button.on{color:var(--text);border-bottom-color:var(--acc)}
main{padding:16px 20px;max-width:1200px}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 16px;min-width:130px}
.card .n{font-size:22px}
.card .l{color:var(--dim);font-size:12px}
table{border-collapse:collapse;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:normal;font-size:12px}
tr:last-child td{border-bottom:none}
tr.row{cursor:pointer}
tr.row:hover td{background:#1b2230}
.tag{padding:1px 7px;border-radius:9px;font-size:12px}
.tag.ok{background:#12321c;color:var(--ok)}.tag.warn{background:#332a12;color:var(--warn)}.tag.bad{background:#3a1518;color:var(--bad)}.tag.dim{background:#232a36;color:var(--dim)}
pre{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-word}
select,input,textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;color:var(--text);padding:6px 9px;font:inherit}
textarea{width:100%;min-height:170px}
button.act{background:#1c2634;border:1px solid var(--line);border-radius:5px;color:var(--text);padding:6px 12px;cursor:pointer;font:inherit}
button.act:hover{border-color:var(--acc)}
button.mini{padding:2px 8px;font-size:12px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
h2{font-size:13px;color:var(--dim);font-weight:normal;text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px}
.err{color:var(--bad)}
a{color:var(--acc);text-decoration:none}
header input{width:230px;font-size:12px;padding:4px 8px}
.grid3{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center}
.rowlist{display:flex;flex-direction:column;gap:6px}
.rowlist .item{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#131923;border:1px solid var(--line);border-radius:5px;padding:7px 9px}
.rowlist input,.rowlist select{font-size:12px;padding:4px 7px}
svg .axis{stroke:var(--line)}
svg text{fill:var(--dim);font-size:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 0;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

/* The clinical surface.

   A summary is read as complete — that is its clinical function — so the one
   thing this stylesheet has to do is make a panel that is NOT complete
   impossible to mistake for one that is. An empty panel and an empty panel
   that failed to load look identical unless something here makes them differ,
   and an allergy list that is short because a store threw is the failure the
   whole chart module is built to refuse.

   So incompleteness is carried on the left border and in a line of prose
   inside the panel, not in a subtle tint somebody reads past at 3am. The three
   reasons are visually distinct because they call for different actions:
   failed means go and look elsewhere before you prescribe, truncated means
   there is more below, withheld means the patient asked and break-glass is the
   way through. */
.panel{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:6px;padding:10px 14px;margin-bottom:10px}
.panel.bad{border-left-color:var(--bad)}
.panel.warn{border-left-color:var(--warn)}
.panel.held{border-left-color:var(--acc)}
.panel h3{margin:0 0 6px;font-size:13px;font-weight:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);display:flex;gap:8px;align-items:center}
.panel .why{margin:4px 0 0;font-size:12.5px;padding:6px 9px;border-radius:4px;background:#1b2230}
.panel.bad .why{color:var(--bad)}
.panel.warn .why{color:var(--warn)}
.panel.held .why{color:var(--acc)}
.panel ul{margin:4px 0 0;padding-left:18px}
.panel li{margin:2px 0}
.panel .none{color:var(--dim);font-size:12.5px;margin:2px 0 0}
.banner{border:1px solid var(--line);border-left:3px solid var(--warn);background:#241d0f;border-radius:6px;padding:10px 14px;margin-bottom:14px}
.banner.bad{border-left-color:var(--bad);background:#2a1416}
.banner b{color:var(--warn)}
.banner.bad b{color:var(--bad)}
.banner ul{margin:6px 0 0;padding-left:18px}
.crit{color:var(--bad);font-weight:bold}
.chartgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:900px){.chartgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>PORTAGE</h1><span class="sub">health integration engine</span>
  <span class="sub" style="margin-left:auto">api key</span>
  <input id="apikey" type="password" placeholder="ptg_… (blank if auth is off)" title="Stored in this browser only and sent with every request">
</header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
const $=(s,el=document)=>el.querySelector(s);
/* Escapes apostrophes as well as the usual four. Every id rendered into an
   onclick sits inside a single-quoted attribute, and today they all happen to
   be uuids or charset-validated — which is a property of the current callers,
   not of this function, and not something the next row added here should have
   to know. */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// The key lives in this browser and is attached to every request. Nothing is
// sent anywhere else, and the server never returns a stored key.
const KEY="portage.apikey";
const apiKey=()=>localStorage.getItem(KEY)||"";
const j=async(url,opts={})=>{
  const key=apiKey();
  const headers={...(opts.headers||{}),...(key?{authorization:"Bearer "+key}:{})};
  const r=await fetch(url,{...opts,headers});
  const b=await r.text();let d;try{d=JSON.parse(b)}catch{d=b}
  if(r.status===401||r.status===403)throw new Error(r.status===401?"not authenticated — set an API key above":"this key lacks the scope for that");
  if(!r.ok&&!(d&&typeof d==="object"))throw new Error(r.status+" "+b);
  return{status:r.status,data:d};
};
const tag=(t,cls)=>`<span class="tag ${cls}">${esc(t)}</span>`;
const stTag=s=>tag(s,{processed:"ok",delivered:"ok",filtered:"dim",queued:"warn",retrying:"warn",inflight:"warn",error:"bad",dead:"bad",discarded:"dim",active:"ok"}[s]||"dim");
const TABS=["Dashboard","Chart","Worklist","Break-glass","History","Audit","Channels","Designer","Mappings","Messages","Deliveries","FHIR","Subscriptions","Terminology","Conformance"];
let tab="Dashboard",timer=null;

function nav(){$("#nav").innerHTML=TABS.map(t=>`<button class="${t===tab?"on":""}" onclick="go('${t}')">${t}</button>`).join("")}
window.go=t=>{tab=t;if(timer){clearInterval(timer);timer=null}nav();render()};

async function render(){
  const m=$("#main");
  try{
    if(tab==="Dashboard")await dash(m);
    else if(tab==="Chart")await chartTab(m);
    else if(tab==="Worklist")await worklistTab(m);
    else if(tab==="Break-glass")await glassTab(m);
    else if(tab==="History")await history(m);
    else if(tab==="Audit")await auditTab(m);
    else if(tab==="Designer")await designer(m);
    else if(tab==="Mappings")await mapEditor(m);
    else if(tab==="Channels")await channels(m);
    else if(tab==="Messages")await messages(m);
    else if(tab==="Deliveries")await deliveries(m);
    else if(tab==="FHIR")await fhirTab(m);
    else if(tab==="Subscriptions")await subsTab(m);
    else if(tab==="Terminology")await termTab(m);
    else if(tab==="Conformance")await confTab(m);
  }catch(e){m.innerHTML=`<p class="err">${esc(e.message||e)}</p>`}
}

/* ---------------------------------------------------------------- clinical

   Three tabs, and one idea running through all of them: the honesty the
   stores go to such lengths to produce is worth nothing until it reaches
   somebody's eyes. `complete` and `omissions` have existed on every section
   since the chart was written, and until now nothing rendered them.

   Everything here goes through the same clinical API as any other caller.
   There is no privileged path, which means every read below leaves an audit
   row and passes the directive check — a console that could see more than the
   API allows would make the audit trail a description of something other than
   what happened. */

/* How a section says it is not the whole truth.

   Distinguishing the reasons is the point. `unavailable` is a fault, and the
   panel must not be read as "none". `withheld` is the patient's instruction,
   which is not a fault at all and must not be rendered as one — a clinician
   who reads a lockbox as an outage goes looking for a bug instead of having a
   conversation. `truncated` just means there is more. */
function panel(title,sec,render,extra){
  const inc=sec&&sec.incomplete;
  const cls=!inc?"":inc.reason==="unavailable"?"bad":inc.reason==="withheld"?"held":"warn";
  const items=(sec&&sec.items)||[];
  let why="";
  if(inc&&inc.reason==="unavailable")why=`this panel is empty because it failed to load, not because there is nothing — ${esc(inc.detail)}`;
  else if(inc&&inc.reason==="withheld")why=esc(inc.detail);
  else if(inc&&inc.reason==="truncated")why=`showing ${inc.shown} of ${inc.total}`;
  const body=inc&&inc.reason==="withheld"?""
    :items.length?`<ul>${items.map(render).join("")}</ul>`
    :`<p class="none">none recorded</p>`;
  return `<div class="panel ${cls}"><h3>${esc(title)}${extra?" "+extra:""}${inc?tag(inc.reason,cls):""}</h3>
    ${why?`<p class="why">${why}</p>`:""}${body}</div>`;
}

const when=v=>esc(String(v??"").replace("T"," ").slice(0,16));
/* Chart entries carry their FHIR resource as a JSON string, so a renderer that
   reaches straight for `.code.text` gets undefined and falls back to printing
   the entry type — a problem list reading "Condition, Condition", which is
   both useless and looks like data rather than a bug. */
const body=e=>{try{return JSON.parse(e.content)}catch{return{}}};
/* A date qualifier that disappears when there is no date, rather than leaving
   a bare "due" on the row. An empty deadline is not the same as a deadline, and
   a label with nothing after it reads as a rendering fault. */
const due=(label,v)=>v?`<span class="none">${esc(label)} ${when(v)}</span>`:"";

async function chartTab(m){
  const q=sessionStorage.getItem("portage.patient")||"";
  m.innerHTML=`<div class="bar">
    <input id="pt" placeholder="patient identifier, e.g. NT123456" style="width:260px" value="${esc(q)}">
    <button class="act" onclick="loadChart()">open chart</button>
    <input id="ptname" placeholder="or search by family name" style="width:200px">
    <button class="act" onclick="findPatient()">search</button></div>
    <div id="chart"></div>`;
  if(q)await loadChart();
}

window.findPatient=async()=>{
  const family=$("#ptname").value.trim();
  const out=$("#chart");
  if(!family)return;
  try{
    const {data}=await j("/api/clinical/patients?family="+encodeURIComponent(family));
    const rows=(data.rows||[]);
    out.innerHTML=`${data.withheldCount?`<div class="banner"><b>${data.withheldCount} match(es) withheld</b> by a patient directive. A short list that looks complete is the thing this system refuses, so it says so rather than quietly returning fewer.</div>`:""}
      <table><tr><th>identifier</th><th>name</th><th>born</th></tr>
      ${rows.map(r=>`<tr class="row" onclick="openChart('${esc(r.patient_id)}')"><td>${esc(r.patient_id)}</td>
        <td>${esc(r.family||"")}, ${esc(r.given||"")}</td><td>${esc(r.birthDate||r.birth_date||"")}</td></tr>`).join("")
      ||`<tr><td colspan="3" class="none">no match</td></tr>`}</table>`;
  }catch(e){out.innerHTML=`<p class="err">${esc(e.message||e)}</p>`}
};

window.openChart=id=>{sessionStorage.setItem("portage.patient",id);$("#pt").value=id;loadChart()};

window.loadChart=async()=>{
  const id=$("#pt").value.trim();
  const out=$("#chart");
  if(!id){out.innerHTML="";return}
  sessionStorage.setItem("portage.patient",id);
  out.innerHTML=`<p class="none">loading…</p>`;
  let c;
  try{
    const r=await j("/api/clinical/chart?patient="+encodeURIComponent(id));
    if(r.status===403){
      // The refusal names the way through, and so does this. A clinician who
      // needs the record in an emergency should not have to know the API.
      out.innerHTML=`<div class="banner bad"><b>This record is withheld by a patient directive.</b>
        <p>The patient has asked that this record not be shown. If the clinical situation warrants overriding that, declare it — the declaration is recorded, the patient is told, and somebody reviews it.</p>
        <div class="bar"><input id="bg-reason" placeholder="why you need it, and why now" style="width:420px">
        <button class="act" onclick="declareGlass('${esc(id)}')">break glass</button></div>
        <p class="none">A one-word reason is refused. This row is what a privacy office reads when the patient asks who opened their record.</p>
        <div id="bg-out"></div></div>`;
      return;
    }
    c=r.data;
  }catch(e){out.innerHTML=`<p class="err">${esc(e.message||e)}</p>`;return}

  const p=c.patient||{};
  const status=c.allergyStatus;
  const statusTag=status==="never-asked"?tag("never asked","bad")
    :status==="unavailable"?tag("unknown","bad")
    :status==="clear"?tag("no known allergies","ok"):tag(esc(String(status)),"warn");

  out.innerHTML=`
    <div class="cards"><div class="card"><div class="n">${esc(p.family||"—")}, ${esc(p.given||"")}</div><div class="l">${esc(c.patientId)}${p.birthDate?" · born "+esc(p.birthDate):""}${p.preferredLanguage?" · "+esc(p.preferredLanguage):""}${p.phone?" · "+esc(p.phone):""}</div></div>
      <div class="card"><div class="n">${statusTag}</div><div class="l">allergy status</div></div>
      <div class="card"><div class="n">${c.immunizationStatus==="never-asked"?tag("never asked","bad"):tag(esc(String(c.immunizationStatus||"")),"ok")}</div><div class="l">immunization history</div></div>
      <div class="card"><div class="n">${c.vitalStatus==="never-measured"?tag("never measured","bad"):tag(esc(String(c.vitalStatus||"")),"ok")}</div><div class="l">vital signs</div></div></div>
    ${c.complete?"":`<div class="banner"><b>This is not the whole chart.</b>
      <p>Do not read a panel below as "none" without checking why it is short.</p>
      <ul>${(c.omissions||[]).map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div>`}
    <div class="chartgrid">
      <div>
        ${panel("Allergies",c.allergies,a=>`<li>${esc(a.display)} ${a.criticality?tag(a.criticality,a.criticality==="high"?"bad":"warn"):""} <span class="none">${esc(a.reaction||"")}</span></li>`)}
        ${panel("Medications",c.medications,x=>`<li>${esc(x.display)} <span class="none">${esc(x.adherence||"")}</span></li>`)}
        ${panel("Problems",c.problems,x=>{const b=body(x);return `<li>${esc((b.code&&(b.code.text||(b.code.coding&&b.code.coding[0]&&b.code.coding[0].display)))||b.resourceType||x.entry_type)}${b.clinicalStatus?" "+tag(esc(String(b.clinicalStatus.text||b.clinicalStatus)),"dim"):""}</li>`})}
        ${panel("Immunizations",c.immunizations,x=>`<li>${esc(x.vaccine)} ${stTag(x.status)} <span class="none">${esc(x.occurrenceAt||"")}</span></li>`)}
        ${panel("Vitals",c.vitals,x=>`<li>${esc(x.kind)} ${x.kind==="blood-pressure"?`<b>${esc(String(x.systolic))}/${esc(String(x.diastolic))}</b>`:`<b>${esc(String(x.value))}</b>`} <span class="none">${esc(x.unit||"")} ${when(x.takenAt)}</span></li>`)}
        ${panel("Care team",c.careTeam,x=>`<li>${esc(x.role)} — ${esc(x.practitioner_id)}${x.active_to?" "+tag("ended","dim"):""}</li>`)}
        ${panel("Coverage",c.coverage,x=>`<li>${esc(x.plan)} ${stTag(x.eligibility)} <span class="none">${esc(x.identifier_value||"")}</span></li>`)}
        ${panel("Open messages",c.openThreads,x=>`<li>${esc(x.subject)} ${stTag(x.status)} <span class="none">${esc(x.owner_id||"unowned")}</span></li>`)}
        ${panel("Recent notes",c.recentNotes,n=>`<li>${when(n.entry&&n.entry.recorded_at)} — ${esc((n.note&&(n.note.title||n.note.description))||"note")}</li>`)}
      </div>
      <div>
        ${panel("Unacknowledged results",c.unacknowledgedResults,r=>`<li>${esc(r.display)}: <b class="${r.abnormal_flag&&r.abnormal_flag.includes("critical")?"crit":""}">${esc(r.value)}</b>
          ${r.abnormal_flag?tag(r.abnormal_flag,r.abnormal_flag.includes("critical")?"bad":"warn"):""} <span class="none">${when(r.reported_at)}</span></li>`)}
        ${panel("Open orders",c.openOrders,o=>`<li>${esc(o.display)} ${stTag(o.status)} ${due("expected",o.expected_by)}</li>`)}
        ${panel("Open referrals",c.openReferrals,r=>`<li>${esc(r.to_service)} ${stTag(r.status)} ${due("due",r.expected_by)}</li>`)}
        ${panel("Open tasks",c.openTasks,t=>`<li>${esc(t.title)} ${stTag(t.status)}</li>`)}
      </div>
    </div>`;
};

window.declareGlass=async(patient)=>{
  const reason=$("#bg-reason").value.trim();
  const out=$("#bg-out");
  try{
    const {status,data}=await j("/api/clinical/break-glass",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({patient,reason})});
    if(status!==201){out.innerHTML=`<p class="err">${esc(data.error||"refused")}</p>`;return}
    out.innerHTML=`<p class="none">declared — the patient will be told and this will be reviewed</p>`;
    loadChart();
  }catch(e){out.innerHTML=`<p class="err">${esc(e.message||e)}</p>`}
};

async function worklistTab(m){
  const who=localStorage.getItem("portage.clinician")||"";
  m.innerHTML=`<div class="bar"><input id="cl" placeholder="clinician id, e.g. dr-tetso" style="width:220px" value="${esc(who)}">
    <button class="act" onclick="loadWorklist()">open worklist</button></div><div id="wl"></div>`;
  if(who)await loadWorklist();
}

window.loadWorklist=async()=>{
  const who=$("#cl").value.trim();
  const out=$("#wl");
  if(!who){out.innerHTML="";return}
  localStorage.setItem("portage.clinician",who);
  try{
    const {data:w}=await j("/api/clinical/worklist?clinician="+encodeURIComponent(who));
    const {data:res}=await j("/api/clinical/results");
    out.innerHTML=`
      ${w.complete?"":`<div class="banner"><b>This worklist is not complete.</b>
        <p>Something owed to you may not be on it.</p><ul>${(w.omissions||[]).map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div>`}
      ${panel("Today's appointments",w.today,x=>`<li>${when(x.slot&&x.slot.starts_at)} ${esc(x.slot&&x.slot.service||"")}
        <a href="#" onclick="openChart('${esc(x.booking.patient_id)}');go('Chart');return false">${esc(x.booking.patient_id)}</a>
        ${stTag(x.booking.status)} <span class="none">${esc(x.booking.reason||"")}</span></li>`)}
      ${panel("Messages you owe a reply",w.awaitingMessages,x=>`<li>${esc(x.subject)}
        <a href="#" onclick="openChart('${esc(x.patient_id)}');go('Chart');return false">${esc(x.patient_id)}</a>
        ${stTag(x.priority)} ${stTag(x.status)}</li>`)}
      ${panel("Messages nobody owns",w.unassignedMessages,x=>`<li>${esc(x.subject)}
        <a href="#" onclick="openChart('${esc(x.patient_id)}');go('Chart');return false">${esc(x.patient_id)}</a>
        ${stTag(x.priority)}</li>`)}
      ${res.withheldCount?`<div class="banner"><b>${res.withheldCount} result(s) withheld</b> by a patient directive.
        <p>A result withheld from the clinician responsible for reading it is a result now owed to nobody. Who they are is not shown, which is what the directive asked for — but somebody has to pick these up.</p></div>`:""}
      ${panel("Results you have not acknowledged",w.unacknowledgedResults,r=>`<li>
        ${esc(r.display)}: <b class="${r.abnormal_flag&&r.abnormal_flag.includes("critical")?"crit":""}">${esc(r.value)}</b>
        ${r.abnormal_flag?tag(r.abnormal_flag,r.abnormal_flag.includes("critical")?"bad":"warn"):""}
        <a href="#" onclick="openChart('${esc(r.patient_id)}');go('Chart');return false">${esc(r.patient_id)}</a>
        <span class="none">${when(r.reported_at)}</span>
        <div class="bar" style="margin:6px 0 0"><input id="ack-${esc(r.id)}" placeholder="what you did about it" style="width:320px">
        <button class="act mini" onclick="ack('${esc(r.id)}')">acknowledge</button></div>
        <div id="ackout-${esc(r.id)}"></div></li>`)}
      ${panel("Referrals that have gone quiet",w.stalledReferrals,r=>`<li>${esc(r.to_service)} for
        <a href="#" onclick="openChart('${esc(r.patient_id)}');go('Chart');return false">${esc(r.patient_id)}</a>
        ${stTag(r.status)} ${due("due",r.expected_by)}</li>`)}
      ${panel("Orders with no result back",w.ordersAwaitingResult,o=>`<li>${esc(o.display)} for
        <a href="#" onclick="openChart('${esc(o.patient_id)}');go('Chart');return false">${esc(o.patient_id)}</a>
        ${due("expected",o.expected_by)}</li>`)}
      ${panel("Tasks",w.tasks,t=>`<li>${esc(t.title)} ${stTag(t.status)}</li>`)}
      ${panel("Medication reconciliations left open",w.incompleteReconciliations,r=>`<li>${esc(r.transition)} for
        <a href="#" onclick="openChart('${esc(r.patient_id)}');go('Chart');return false">${esc(r.patient_id)}</a>
        <span class="none">started ${when(r.started_at)}</span></li>`)}`;
  }catch(e){out.innerHTML=`<p class="err">${esc(e.message||e)}</p>`}
};

window.ack=async(id)=>{
  const action=$("#ack-"+CSS.escape(id)).value.trim();
  const out=$("#ackout-"+CSS.escape(id));
  try{
    const {status,data}=await j("/api/clinical/acknowledge",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({result:id,action})});

    // the only part a clinician can act on.
    if(status!==200){out.innerHTML=`<p class="err">${esc(data.error||"refused")}</p>`;return}
    loadWorklist();
  }catch(e){out.innerHTML=`<p class="err">${esc(e.message||e)}</p>`}

    m.innerHTML=`

        <p class="why">A lockbox nobody can find out was opened is a lockbox with no lock. Telling them happens on a channel this system does not own — a letter, a call — so record it here once it has happened.</p>

      <div class="panel ${data.awaitingReview.length?"warn":""}"><h3>Overrides nobody has reviewed ${tag(String(data.awaitingReview.length),data.awaitingReview.length?"warn":"ok")}</h3>

    m.querySelectorAll("table").forEach((t,i)=>{

// Inline SVG rather than a chart library: this file is served whole with no
// build step and no external fetches, and a CDN script would break that.
function barChart(buckets,series,height=150){
  if(!buckets.length)return '<p class="sub" style="color:var(--dim)">no activity in this window</p>';
  // Bar width is capped so a window holding one or two buckets shows readable
  // bars rather than two enormous slabs.
  const pad=26,bw=Math.min(48,Math.max(10,600/buckets.length)),w=Math.max(360,pad*2+bw*buckets.length);
  const totals=buckets.map((_,i)=>series.reduce((a,s)=>a+(s.values[i]||0),0));
  const max=Math.max(1,...totals);
  const y=v=>height-pad-(v/max)*(height-pad*2);
  let bars="";
  buckets.forEach((b,i)=>{
    let base=height-pad;
    series.forEach(s=>{
      const v=s.values[i]||0;if(!v)return;
      const h=(v/max)*(height-pad*2);base-=h;
      bars+=`<rect x="${pad+i*bw+2}" y="${base}" width="${Math.max(1,bw-4)}" height="${h}" fill="${s.color}"><title>${esc(b)} ${esc(s.label)}: ${v}</title></rect>`;
    });
  });
  const every=Math.ceil(buckets.length/8);
  const labels=buckets.map((b,i)=>i%every?"":`<text x="${pad+i*bw+bw/2}" y="${height-8}" text-anchor="middle">${esc(b.slice(-5))}</text>`).join("");
  return `<div style="overflow-x:auto"><svg width="${w}" height="${height}" role="img">
    <line class="axis" x1="${pad}" y1="${height-pad}" x2="${w-pad}" y2="${height-pad}"/>
    <line class="axis" x1="${pad}" y1="${pad}" x2="${pad}" y2="${height-pad}"/>
    <text x="4" y="${y(max)+4}">${max}</text><text x="4" y="${height-pad+4}">0</text>
    ${bars}${labels}</svg></div>`;
}

const legend=series=>`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join("")}</div>`;

async function history(m){
  const hours=m.dataset.hours||"24",bucket=m.dataset.bucket||"hour";
  const {data}=await j(`/api/history?hours=${hours}&bucket=${bucket}`);

  // Pivot the grouped rows into one series per status over a shared axis.
  const keys=[...new Set([...data.messages.map(r=>r.bucket),...data.deliveries.map(r=>r.bucket)])].sort();
  const series=(rows,field,wanted,color)=>({
    label:wanted,color,
    values:keys.map(k=>rows.filter(r=>r.bucket===k&&(field?r[field]===wanted:true)).reduce((a,r)=>a+r.n,0)),
  });
  const msgSeries=[
    series(data.messages,"status","processed","#3fb950"),
    series(data.messages,"status","filtered","#8b95a5"),
    series(data.messages,"status","error","#f85149"),
  ].filter(s=>s.values.some(v=>v>0));
  const delSeries=[series(data.deliveries,null,"delivered","#4ea1ff")].filter(s=>s.values.some(v=>v>0));

  const sum=s=>s.reduce((a,x)=>a+x.values.reduce((b,v)=>b+v,0),0);
  m.innerHTML=`<div class="bar">
      <select onchange="$('#main').dataset.hours=this.value;render()">${["6","24","72","168"].map(h=>`<option value="${h}" ${h===hours?"selected":""}>last ${h}h</option>`).join("")}</select>
      <select onchange="$('#main').dataset.bucket=this.value;render()">${["hour","day"].map(b=>`<option ${b===bucket?"selected":""}>${b}</option>`).join("")}</select>
      <button class="act mini" onclick="render()">refresh</button></div>
    <div class="cards"><div class="card"><div class="n">${sum(msgSeries)}</div><div class="l">messages received</div></div>
      <div class="card"><div class="n">${sum(delSeries)}</div><div class="l">deliveries completed</div></div></div>
    <h2>messages received, by status</h2>${barChart(keys,msgSeries)}${msgSeries.length?legend(msgSeries):""}
    <h2>deliveries completed</h2>${barChart(keys,delSeries)}
    <p class="sub" style="color:var(--dim)">Messages are bucketed by arrival, deliveries by completion. A message
      received during an outage and delivered hours later appears in both, at different times — which is the point.</p>`;
}

  `<label class="sub" style="color:var(--dim)">${k}</label>
   <input type="${type}" placeholder="${esc(ph)}" value="${esc(bag[k]??"")}" oninput="${onchange}('${k}',this.value)">`).join("");

function buildConfig(){
  const cfg={id:design.id,name:design.name||design.id,source:{type:design.sourceType}};
  for(const[k,v]of Object.entries(design.source)){
    if(v==="")continue;
    if(k==="resourceTypes")cfg.source[k]=String(v).split(",").map(s=>s.trim()).filter(Boolean);
    else if(k==="port"||k==="pollMs")cfg.source[k]=Number(v);
    else cfg.source[k]=v;
  }
  if(design.steps.length)cfg.pipeline=design.steps.map(s=>{
    const step={type:s.type};
    for(const[k,v]of Object.entries(s.fields)){
      if(v==="")continue;
      step[k]=k==="allow"?String(v).split(",").map(x=>x.trim()).filter(Boolean):v;
    }
    return step;
  });
  cfg.destinations=design.dests.map((d,i)=>{
    const dest={id:d.fields.id||`dest-${i+1}`,type:d.type,ordered:!!d.ordered};
    for(const[k,v]of Object.entries(d.fields)){
      if(v===""||k==="id")continue;
      dest[k]=["maxAttempts","backoffBaseMs","backoffCapMs","timeoutMs","port"].includes(k)?Number(v):v;
    }
    return dest;
  });
  return cfg;
}

  const {data}=await j("/api/channels");
  m.innerHTML=`<table><tr><th>id</th><th>name</th><th>source</th><th>state</th><th>chain</th></tr>
    ${data.map(c=>`<tr class="row" onclick="chanDetail('${esc(c.id)}')"><td>${esc(c.id)}</td><td>${esc(c.name)}</td><td>${esc(c.source)}${c.mllpPort?` :${c.mllpPort}`:""}</td>
      <td>${c.running?tag("running","ok"):c.enabled?tag("stopped","warn"):tag("disabled","dim")}</td>
      <td><button class="act mini" onclick="event.stopPropagation();verifyChain('${esc(c.id)}',this)">verify</button></td></tr>`).join("")}
  </table><div id="detail"></div>`;
}
window.chanDetail=async id=>{const {data}=await j("/api/channels/"+id);$("#detail").innerHTML=`<h2>${esc(id)}</h2><pre>${esc(JSON.stringify(data,null,2))}</pre>`};
window.verifyChain=async(id,btn)=>{const {data}=await j("/api/chain/verify?channel_id="+id);btn.outerHTML=data.ok?tag("intact "+data.checked,"ok"):tag("BROKEN at "+esc(data.brokenAt),"bad")};

async function messages(m){
  const chans=(await j("/api/channels")).data;
  const cur={ch:m.dataset.ch||"",st:m.dataset.st||""};
  const {data}=await j(`/api/messages?limit=50${cur.ch?"&channel_id="+cur.ch:""}${cur.st?"&status="+cur.st:""}`);
  m.innerHTML=`<div class="bar">
    <select onchange="$('#main').dataset.ch=this.value;render()"><option value="">all channels</option>${chans.map(c=>`<option ${c.id===cur.ch?"selected":""}>${esc(c.id)}</option>`).join("")}</select>
    <select onchange="$('#main').dataset.st=this.value;render()"><option value="">all statuses</option>${["processed","filtered","error"].map(s=>`<option ${s===cur.st?"selected":""}>${s}</option>`).join("")}</select>
    <button class="act mini" onclick="render()">refresh</button></div>
  <table><tr><th>seq</th><th>channel</th><th>received</th><th>source</th><th>status</th></tr>
    ${data.map(r=>`<tr class="row" onclick="msgDetail('${esc(r.id)}')"><td>${r.seq}</td><td>${esc(r.channel_id)}</td><td>${esc(r.received_at)}</td><td>${esc(r.source_type)}</td><td>${stTag(r.status)}${r.error?` <span class="err">${esc(r.error)}</span>`:""}</td></tr>`).join("")}
  </table><div id="detail"></div>`;
}
window.msgDetail=async id=>{
  const {data}=await j("/api/messages/"+id);
  $("#detail").innerHTML=`<h2>message ${id}</h2><pre>${esc(data.raw)}</pre>
    <h2>steps</h2><table><tr><th>#</th><th>step</th><th>output</th></tr>${(data.steps||[]).map(s=>`<tr><td>${s.step_index}</td><td>${esc(s.name)}</td><td><pre style="margin:0;max-height:150px">${esc(s.output??"")}</pre></td></tr>`).join("")}</table>
    <h2>deliveries</h2><table><tr><th>destination</th><th>state</th><th>attempts</th><th>last error</th></tr>${(data.deliveries||[]).map(d=>`<tr><td>${esc(d.destination_id)}</td><td>${stTag(d.state)}</td><td>${d.attempts}</td><td class="err">${esc(d.last_error??"")}</td></tr>`).join("")}</table>`;
};

async function deliveries(m){
  const cur=m.dataset.state||"";
  const {data}=await j(`/api/deliveries?limit=50${cur?"&state="+cur:""}`);
  m.innerHTML=`<div class="bar"><select onchange="$('#main').dataset.state=this.value;render()">
      <option value="">all states</option>${["queued","retrying","inflight","delivered","dead","discarded"].map(s=>`<option ${s===cur?"selected":""}>${s}</option>`).join("")}</select>
    <button class="act mini" onclick="render()">refresh</button></div>
  <table><tr><th>channel</th><th>destination</th><th>seq</th><th>state</th><th>attempts</th><th>next attempt</th><th>last error</th><th></th></tr>
    ${data.map(d=>`<tr><td>${esc(d.channel_id)}</td><td>${esc(d.destination_id)}</td><td>${d.seq}</td><td>${stTag(d.state)}</td><td>${d.attempts}/${d.max_attempts}</td><td>${esc(d.next_attempt_at??"")}</td><td class="err">${esc((d.last_error??"").slice(0,80))}</td>
      <td>${d.state==="dead"?`<button class="act mini" onclick="act('${esc(d.id)}','replay')">replay</button> <button class="act mini" onclick="act('${esc(d.id)}','discard')">discard</button>`:""}</td></tr>`).join("")}
  </table>`;
}
window.act=async(id,what)=>{await j(`/api/deliveries/${id}/${what}`,{method:"POST"});render()};

async function fhirTab(m){
  const {data:cap}=await j("/fhir/metadata");
  const types=(cap.rest?.[0]?.resource||[]).map(r=>r.type);
  const cur={t:m.dataset.t||types[0]||"Patient",q:m.dataset.q||""};
  m.innerHTML=`<div class="bar">
    <select onchange="$('#main').dataset.t=this.value;render()">${types.map(t=>`<option ${t===cur.t?"selected":""}>${t}</option>`).join("")}</select>
    <input placeholder="identifier token (value or system|value)" value="${esc(cur.q)}" style="width:340px" onchange="$('#main').dataset.q=this.value;render()">
    <button class="act mini" onclick="render()">search</button></div><div id="list"></div><div id="detail"></div>`;
  const {data}=await j(`/fhir/${cur.t}?_count=25${cur.q?"&identifier="+encodeURIComponent(cur.q):""}`);
  $("#list").innerHTML=`<p class="sub" style="color:var(--dim)">${data.total??0} match(es)</p><table><tr><th>id</th><th>version</th><th>updated</th></tr>
    ${(data.entry||[]).map(e=>`<tr class="row" onclick="readRes('${esc(cur.t)}','${esc(e.resource.id)}')"><td>${esc(e.resource.id)}</td><td>${esc(e.resource.meta?.versionId??"")}</td><td>${esc(e.resource.meta?.lastUpdated??"")}</td></tr>`).join("")}</table>`;
}
window.readRes=async(t,id)=>{const {data}=await j(`/fhir/${t}/${id}`);$("#detail").innerHTML=`<h2>${t}/${esc(id)}</h2><pre>${esc(JSON.stringify(data,null,2))}</pre>`};

async function subsTab(m){
  const {data}=await j("/fhir/Subscription");
  m.innerHTML=`<table><tr><th>id</th><th>status</th><th>criteria</th><th>endpoint</th><th></th></tr>
    ${(data.entry||[]).map(e=>{const r=e.resource;return`<tr><td>${esc(r.id)}</td><td>${stTag(r.status)}</td><td>${esc(r.criteria)}</td><td>${esc(r.channel?.endpoint)}</td>
      <td><button class="act mini" onclick="delSub('${esc(r.id)}')">delete</button></td></tr>`}).join("")}
  </table>
  <h2>create rest-hook subscription</h2>
  <div class="bar"><input id="s-crit" placeholder='criteria, e.g. Patient or Observation?identifier=NT123456' style="width:340px">
    <input id="s-end" placeholder="endpoint, e.g. https://host/hook" style="width:300px">
    <button class="act" onclick="mkSub()">create</button></div><div id="s-out"></div>`;
}
window.delSub=async id=>{await j("/fhir/Subscription/"+id,{method:"DELETE"});render()};
window.mkSub=async()=>{
  const body={resourceType:"Subscription",status:"requested",criteria:$("#s-crit").value,channel:{type:"rest-hook",endpoint:$("#s-end").value}};
  const r=await j("/fhir/Subscription",{method:"POST",headers:{"content-type":"application/fhir+json"},body:JSON.stringify(body)});
  if(r.status===201)render();else $("#s-out").innerHTML=`<p class="err">${esc(JSON.stringify(r.data))}</p>`;
};

async function termTab(m){
  const {data:s}=await j("/api/terminology/stats");
  m.innerHTML=`<div class="cards"><div class="card"><div class="n">${s.concepts}</div><div class="l">concepts</div></div>
    <div class="card"><div class="n">${s.valueSets}</div><div class="l">value sets</div></div>
    <div class="card"><div class="n">${s.maps}</div><div class="l">concept maps</div></div></div>
  <div class="split">
    <div><h2>lookup</h2><div class="bar"><input id="l-sys" placeholder="system" style="width:250px"><input id="l-code" placeholder="code"><button class="act" onclick="doLookup()">go</button></div>
      <h2>expand</h2><div class="bar"><input id="e-vs" placeholder="valueset id, e.g. lab-codes-demo" style="width:250px"><button class="act" onclick="doExpand()">go</button></div>
      <h2>translate</h2><div class="bar"><input id="t-code" placeholder="code"><input id="t-map" placeholder="map (optional)"><input id="t-target" placeholder="target system (optional)" style="width:220px"><button class="act" onclick="doTranslate()">go</button></div></div>
    <div><h2>result</h2><pre id="t-out">-</pre></div></div>`;
}
const out=d=>{$("#t-out").textContent=JSON.stringify(d,null,2)};
window.doLookup=async()=>{const r=await j(`/api/terminology/lookup?system=${encodeURIComponent($("#l-sys").value)}&code=${encodeURIComponent($("#l-code").value)}`);out(r.data)};
window.doExpand=async()=>{const r=await j(`/api/terminology/expand?valueset=${encodeURIComponent($("#e-vs").value)}`);out(r.data)};
window.doTranslate=async()=>{const p=new URLSearchParams({code:$("#t-code").value});if($("#t-map").value)p.set("map",$("#t-map").value);if($("#t-target").value)p.set("target",$("#t-target").value);const r=await j("/api/terminology/translate?"+p);out(r.data)};

async function confTab(m){
  const {data:packs}=await j("/api/conformance/packs");
  m.innerHTML=`<div class="split"><div>
    <div class="bar"><select id="c-pack">${packs.map(p=>`<option value="${p.id}">${p.id}: ${esc(p.name)}</option>`).join("")}</select>
      <button class="act" onclick="doCap()">capability check</button></div>
    <textarea id="c-res" placeholder='paste a FHIR resource JSON here'></textarea>
    <div class="bar" style="margin-top:8px"><button class="act" onclick="doValidate()">validate</button></div></div>
    <div><h2>result</h2><pre id="c-out">-</pre></div></div>`;
}
window.doValidate=async()=>{
  let resource;try{resource=JSON.parse($("#c-res").value)}catch{$("#c-out").textContent="not valid JSON";return}
  const r=await j("/api/conformance/validate",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({pack:$("#c-pack").value,resource})});
  $("#c-out").textContent=JSON.stringify(r.data,null,2);
};
window.doCap=async()=>{const r=await j("/api/conformance/capability?pack="+encodeURIComponent($("#c-pack").value));$("#c-out").textContent=JSON.stringify(r.data,null,2)};

const keyInput=$("#apikey");
keyInput.value=apiKey();
keyInput.addEventListener("change",()=>{localStorage.setItem(KEY,keyInput.value.trim());render()});

nav();render();
</script>
</body>
</html>
