name: Staging container
on:
  # Manual only. See the note below.
  workflow_dispatch:
# ---------------------------------------------------------------------------
# CI IS DISABLED. Requested by the repository owner on 2026-09-22, so that
# changes are reviewed and promoted by hand rather than gated by an automatic
# run. This workflow no longer starts on a push or a pull request.
#
# Nothing here was weakened to switch it off, and nothing has since been made
# to pass, skip or swallow a failure. Changes made after it was switched off
# only add checks or narrow what a run may do; docs/CI-DISABLED.md lists them.
# What changed to switch it off is the `on:` block
# above this comment: only `workflow_dispatch` remains, so the workflow runs
# when somebody deliberately starts it from the Actions tab and at no other
# time.
#
# To turn it back on, restore the trigger block recorded for this file in
# docs/CI-DISABLED.md.
# ---------------------------------------------------------------------------
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a commit, with the release beside it, for the reason given at
      # the top of ci.yml; the same pins that file and resilience.yml use.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate configuration
        run: docker compose -f deploy/staging/compose.yaml config --quiet
      - name: Build and start isolated staging app
        run: docker compose -f deploy/staging/compose.yaml up --build -d --wait --wait-timeout 120 app
      - name: Check authentication boundaries
        run: docker compose -f deploy/staging/compose.yaml exec -T app node scripts/staging-smoke.ts http://127.0.0.1:8686
      - name: Restart and check persisted instance can reopen
        run: |
          docker compose -f deploy/staging/compose.yaml restart app
          docker compose -f deploy/staging/compose.yaml up -d --wait --wait-timeout 120 app
      - name: Stop containers without printing bootstrap credentials
        if: always()
        run: docker compose -f deploy/staging/compose.yaml down
