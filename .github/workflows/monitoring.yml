name: Monitoring rules and outage drill
on:
  # Manual only. See the note below.
  workflow_dispatch:
# ---------------------------------------------------------------------------
# CI IS DISABLED. Requested by the repository owner on 2026-09-22, so that
# changes are reviewed and promoted by hand rather than gated by an automatic
# run. This workflow no longer starts on a push or a pull request.
#
# Nothing here was weakened to switch it off, and nothing has since been made
# to pass, skip or swallow a failure. Changes made after it was switched off
# only add checks or narrow what a run may do; docs/CI-DISABLED.md lists them.
# What changed to switch it off is the `on:` block
# above this comment: only `workflow_dispatch` remains, so the workflow runs
# when somebody deliberately starts it from the Actions tab and at no other
# time.
#
# To turn it back on, restore the trigger block recorded for this file in
# docs/CI-DISABLED.md.
# ---------------------------------------------------------------------------
permissions:
  contents: read
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a commit, with the release beside it, for the reason given at
      # the top of ci.yml; the same pins that file and resilience.yml use.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Alert rule tests
        run: >-
          docker run --rm --entrypoint /bin/promtool -w /rules
          -v "$PWD/deploy/staging/monitoring:/rules:ro"
          prom/prometheus:latest@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
          test rules alerts.test.yml
      - name: Synthetic outage and recovery delivery
        run: npm run staging:drill
      - name: Ensure drill containers are stopped, retain volumes
        if: always()
        run: docker compose -p healthsystems-alert-drill -f deploy/staging/compose.yaml -f deploy/staging/monitoring.yaml --profile monitoring down
