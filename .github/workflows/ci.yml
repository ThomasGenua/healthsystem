name: CI

# Third-party actions are pinned to a commit, with the release they were taken
# from in the comment beside them. A tag is a moving pointer its owner can
# repoint, and these steps hold a checkout of this repository and a token — so
# a repointed tag is an unreviewed change running with that access. The comment
# is what makes the pin readable and updatable; the hex is what is enforced.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.x is the minimum supported runtime; 24.x is where node:sqlite is
        # no longer flagged experimental, which is what production should run.
        node: ["22.x", "24.x"]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The hazard-identifier check compares this revision against the
          # base branch and the point they diverged, so it needs history
          # rather than the default single commit.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          NORTHSTAR_REQUIRE_BROWSER: "1"
      # Last, because it is the only step that needs a second revision and so
      # the only one that can be skipped for want of one. See
      # src/safety/hazard-ids.ts for why a single tree cannot answer this.
      - name: hazard identifiers
        run: npm run hazardcheck -- origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
