groups:
  - name: healthsystem-operations
    rules:
      - alert: HealthSystemServiceDown
        expr: up{job="healthsystem"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: HealthSystem metrics endpoint unavailable
      - alert: HealthSystemScannerBacklog
        expr: healthsystem_upload_scan_oldest_age_seconds > 900
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: Quarantined uploads are older than fifteen minutes
      - alert: HealthSystemDeliveryFailures
        expr: healthsystem_dead_letters > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: Delivery dead letters require review
      - alert: HealthSystemBackupFailed
        expr: (healthsystem_backup_remote_configured == 1) and (healthsystem_backup_remote_ok == 0)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Configured backup has no verified successful replica
      - alert: HealthSystemBackupStale
        expr: (healthsystem_backup_remote_configured == 1) and (healthsystem_backup_remote_age_seconds > 86400)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Verified backup is older than the staging 24-hour threshold
