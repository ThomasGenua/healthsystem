rule_files: [alerts.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="healthsystem"}'
        values: '0+0x10'
      - series: 'healthsystem_upload_scan_oldest_age_seconds{job="healthsystem"}'
        values: '901+0x10'
      - series: 'healthsystem_dead_letters{job="healthsystem"}'
        values: '1+0x10'
      - series: 'healthsystem_backup_remote_configured{job="healthsystem"}'
        values: '1+0x10'
      - series: 'healthsystem_backup_remote_ok{job="healthsystem"}'
        values: '0+0x10'
      - series: 'healthsystem_backup_remote_age_seconds{job="healthsystem"}'
        values: '90000+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: HealthSystemServiceDown
        exp_alerts:
          - exp_labels: {job: healthsystem, severity: critical}
            exp_annotations: {summary: HealthSystem metrics endpoint unavailable}
      - eval_time: 10m
        alertname: HealthSystemScannerBacklog
        exp_alerts:
          - exp_labels: {job: healthsystem, severity: warning}
            exp_annotations: {summary: Quarantined uploads are older than fifteen minutes}
      - eval_time: 10m
        alertname: HealthSystemDeliveryFailures
        exp_alerts:
          - exp_labels: {job: healthsystem, severity: warning}
            exp_annotations: {summary: Delivery dead letters require review}
      - eval_time: 10m
        alertname: HealthSystemBackupFailed
        exp_alerts:
          - exp_labels: {job: healthsystem, severity: critical}
            exp_annotations: {summary: Configured backup has no verified successful replica}
      - eval_time: 10m
        alertname: HealthSystemBackupStale
        exp_alerts:
          - exp_labels: {job: healthsystem, severity: warning}
            exp_annotations: {summary: Verified backup is older than the staging 24-hour threshold}
  - interval: 1m
    input_series:
      - series: 'up{job="healthsystem"}'
        values: '1+0x10'
      - series: 'healthsystem_upload_scan_oldest_age_seconds{job="healthsystem"}'
        values: '0+0x10'
      - series: 'healthsystem_dead_letters{job="healthsystem"}'
        values: '0+0x10'
      - series: 'healthsystem_backup_remote_configured{job="healthsystem"}'
        values: '0+0x10'
      - series: 'healthsystem_backup_remote_ok{job="healthsystem"}'
        values: '0+0x10'
      - series: 'healthsystem_backup_remote_age_seconds{job="healthsystem"}'
        values: '-1+0x10'
    alert_rule_test:
      - {eval_time: 10m, alertname: HealthSystemServiceDown, exp_alerts: []}
      - {eval_time: 10m, alertname: HealthSystemScannerBacklog, exp_alerts: []}
      - {eval_time: 10m, alertname: HealthSystemDeliveryFailures, exp_alerts: []}
      - {eval_time: 10m, alertname: HealthSystemBackupFailed, exp_alerts: []}
      - {eval_time: 10m, alertname: HealthSystemBackupStale, exp_alerts: []}
